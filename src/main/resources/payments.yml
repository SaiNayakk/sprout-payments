# Configuration for the payments service. Named payments.yml (not application.yml) so several services can
# share one JVM host without their settings colliding.
spring:
  application:
    name: sprout-payments
  datasource:
    url: ${PAYMENTS_DB_URL:jdbc:postgresql://localhost:5432/sprout?currentSchema=payments}
    username: ${PAYMENTS_DB_USER:sprout}
    password: ${PAYMENTS_DB_PASSWORD:sprout}
    hikari:
      maximum-pool-size: 5
      pool-name: payments
      connection-timeout: 2000   # fail fast when the database is gone (CHAOS-01's lesson)
      validation-timeout: 1000
  flyway:
    locations: classpath:db/payments
    schemas: payments
    default-schema: payments
  jackson:
    default-property-inclusion: non_null   # absent, never null: the contracts say so
    deserialization:
      fail-on-unknown-properties: true
  jmx:
    enabled: false

server:
  port: ${PAYMENTS_PORT:8105}
  address: ${PAYMENTS_BIND:127.0.0.1}
  tomcat:
    threads:
      max: 16

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: ${OTEL_ENABLED:false}
        url: ${OTEL_METRICS_URL:http://localhost:4318/v1/metrics}
        step: 15s
    tracing:
      endpoint: ${OTEL_TRACES_URL:http://localhost:4318/v1/traces}
  tracing:
    enabled: ${OTEL_ENABLED:false}
    sampling:
      probability: 1.0
  metrics:
    tags:
      service: sprout-payments

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  pattern:
    correlation: "[%X{requestId:-}] "

sprout:
  payments:
    minimum: "1.00"
    maximum: "100000.00"
    reconcile-every: ${PAYMENTS_RECONCILE_EVERY:15s}
    reconcile-after: 10s           # leave a payment alone this long before checking on it
    # How Sprout Bank reaches us with its callbacks.
    callback-url: ${PAYMENTS_CALLBACK_URL:http://127.0.0.1:8105/internal/v1/bank-events}
    accounts:
      url: ${PAYMENTS_ACCOUNTS_URL:http://127.0.0.1:8104}
      service-key: ${SPROUT_SERVICE_KEY:dev-only-service-key}
    ledger:
      url: ${PAYMENTS_LEDGER_URL:http://127.0.0.1:8106}
    bank:
      url: ${PAYMENTS_BANK_URL:http://127.0.0.1:8107}
      partner-key: ${BANK_SPROUT_PARTNER_KEY:dev-only-partner-key}
      webhook-secret: ${BANK_SPROUT_WEBHOOK_SECRET:dev-only-webhook-secret}
